# Mirevion — Docker Compose de Desenvolvimento
# Inicie com: docker compose up --build
# Serviços: api, web, postgres, redis, minio, celery-worker, celery-beat, nginx (opcional)

services:
  postgres:
    image: postgres:16.4
    container_name: mirevion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mirevion}
      POSTGRES_USER: ${POSTGRES_USER:-mirevion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirevion} -d ${POSTGRES_DB:-mirevion}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mirevion

  redis:
    image: redis:7.2-alpine
    container_name: mirevion-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mirevion

  minio:
    image: minio/minio:RELEASE.2024-01-15T20-16-18Z
    container_name: mirevion-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mirevion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mirevion

  api:
    build:
      context: ./apps/saas
      dockerfile: Dockerfile
    container_name: mirevion-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mirevion

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: mirevion-web
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mirevion

  celery-worker:
    build:
      context: ./apps/saas
      dockerfile: Dockerfile
    container_name: mirevion-celery-worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    command: celery -A config worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - mirevion

  celery-beat:
    build:
      context: ./apps/saas
      dockerfile: Dockerfile
    container_name: mirevion-celery-beat
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    command: celery -A config beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - mirevion

  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: mirevion-nginx
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mirevion

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  mirevion:
    driver: bridge
