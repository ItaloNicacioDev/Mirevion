[project]
name = "mirevion-saas"
version = "1.0.0"
description = "Mirevion SaaS backend — Django, DRF, PostgreSQL, Celery"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27,<0.28",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "celery>=5.3,<6.0",
    "minio>=7.2,<8.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=4.1,<5.0",
    "factory-boy>=3.3,<4.0",
    "faker>=23.0,<24.0",
    "ruff>=0.6,<0.7",
]

[build-system]
requires = ["uv>=0.4,<0.5"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/saas"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
