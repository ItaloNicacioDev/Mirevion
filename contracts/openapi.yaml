openapi: 3.0.3
info:
  title: Mirevion SaaS API
  version: 1.0.0
  description: Contrato oficial da API do Mirevion SaaS. Gerado automaticamente por drf-spectacular.
servers:
  - url: http://localhost:8000
    description: Desenvolvimento local
  - url: https://api.mirevion.com.br
    description: Produção
paths:
  /health/:
    get:
      summary: Healthcheck da API
      tags: [System]
      responses:
        '200':
          description: Serviço operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/auth/login/:
    post:
      summary: Autenticação de usuário
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Tokens de acesso e refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
  /api/v1/auth/refresh/:
    post:
      summary: Renova access token via refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: Novo access token
  /api/v1/auth/logout/:
    post:
      summary: Logout e revogação de refresh token
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout realizado
  /api/v1/organizations/:
    get:
      summary: Lista organizações do usuário autenticado
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de organizações
    post:
      summary: Cria uma nova organização
      tags: [Organizations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cnpj]
              properties:
                name:
                  type: string
                cnpj:
                  type: string
      responses:
        '201':
          description: Organização criada
  /api/v1/users/me/:
    get:
      summary: Dados do usuário autenticado
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cnpj:
          type: string
        created_at:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
